  #     # - key: CACHE_DB_PATH
  #     #   value: /var/data/subsense-cache.db
  #     # - key: STATS_DB_PATH
  #     #   value: /var/data/subsense-stats.db
  #     # - key: META_DB_PATH
  #     #   value: /var/data/subsense-meta.db

# --- Persistent disk (paid plans only): attach to subsense-api for durable caches. ---
#   disk:
#     name: subsense-data
#     mountPath: /var/data
#     sizeGB: 1
# ...then set CACHE_DB_PATH/STATS_DB_PATH/META_DB_PATH to /var/data/... above.
